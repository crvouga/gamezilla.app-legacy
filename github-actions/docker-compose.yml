name: gamezilla_app_github_action_runners

services:
  runner:
    build:
      context: ../
      dockerfile: github-actions/runner.Dockerfile
    environment:
      GITHUB_RUNNER_TOKEN: ${GITHUB_RUNNER_TOKEN}
      GITHUB_RUNNER_URL: ${GITHUB_RUNNER_URL:-https://github.com/crvouga/gamezilla.app}
    privileged: true
    restart: always
