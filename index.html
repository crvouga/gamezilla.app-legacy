<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>gamezilla.app</title>
    <meta
      name="description"
      content="gamezilla.app is a multiplayer gaming app. Play games with your friends online" />
  </head>

  <style>
    body {
      background-color: #000 !important;
    }
    .logo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6rem;
      user-select: none;
      pointer-events: none;
    }

    @tailwind base;
    @tailwind components;
    @keyframes slide {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(200%);
      }
    }
    @tailwind utilities;

    /*

      Remove arrows from number input
      https://stackoverflow.com/questions/26024771/styling-an-input-type-number

    */
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
      margin: 0;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>

  <body>
    <div class="logo">🦕</div>
    <script type="module" src="./gamezilla/gamezilla.client.tsx"></script>
  </body>
</html>
