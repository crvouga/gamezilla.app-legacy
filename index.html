<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>gamezilla.app</title>
    <meta
      name="description"
      content="gamezilla.app is a multiplayer gaming app. Play games with your friends online" />

    <style>
      body {
        background-color: #000 !important;
      }
      .logo {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 6rem;
        user-select: none;
        pointer-events: none;
      }

      @tailwind base;
      @tailwind components;
      @tailwind utilities;
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(200%);
        }
      }

      /*

      Remove arrows from number input
      https://stackoverflow.com/questions/26024771/styling-an-input-type-number

      */
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
        margin: 0;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /*
      Remove autofill background color
      */

      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px white inset !important;
      }
    </style>
  </head>

  <body>
    <div class="logo">🦕</div>
    <script type="module" src="./gamezilla/gamezilla.client.tsx"></script>
    <script>
      window.onerror = function (errorMsg, url, lineNumber, column, errorObj) {
        showError(errorMsg, url, lineNumber, column);
      };

      window.addEventListener("unhandledrejection", function (event) {
        showError(event.reason.toString());
      });

      function showError(errorMsg, url, lineNumber, column) {
        var errorDiv = document.createElement("div");
        errorDiv.style.color = "red";
        errorDiv.style.position = "fixed";
        errorDiv.style.top = "0";
        errorDiv.style.left = "0";
        errorDiv.style.backgroundColor = "white";
        errorDiv.innerHTML =
          "Error: " +
          errorMsg +
          (url ? " - at " + url + ": " + lineNumber + ":" + column : "");
        document.body.appendChild(errorDiv);
      }
    </script>
  </body>
</html>
