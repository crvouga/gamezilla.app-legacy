<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />

    <title>gamezilla.app</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta
      name="description"
      content="gamezilla.app is a multiplayer gaming app. Play games online with your friends." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/mask-icon.png" color="#000000" />
    <meta name="theme-color" content="#000000" />

    <style>
      * {
        margin: 0;
        padding: 0;
        touch-action: manipulation !important;
        -ms-touch-action: manipulation !important;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
      }

      @media (max-width: 400px) {
        body {
          font-size: 75%;
        }
      }

      body {
        overflow: hidden;
        box-sizing: border-box;
        /*  */
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        /*  */
        height: 100dvh;
        max-height: 915px;
        width: 100dvw;
        max-width: 520px;
        /*  */
        display: flex;
        align-items: center;
        justify-content: center;
        /*  */
        background-color: #000;
        color: white;
        /*  */
        border-color: rgb(64 64 64);
        border-style: solid;
        border-width: 1px;
        border-radius: 0.25rem;
      }

      #logo {
        font-size: 6rem;
        user-select: none;
        pointer-events: none;
        touch-action: none;
      }
    </style>
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <div id="logo">🦕</div>

    <script type="module" src="./gamezilla/gamezilla.client.tsx"></script>
  </body>
</html>
