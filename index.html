<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <title>gamezilla.app</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="gamezilla.app is a multiplayer gaming app. Play games online with your friends. There is no need for any downloads. Just play. Play games like Flow, Chess, Battleship, and more."
    />
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="./mask-icon.png" color="#000000" />
    <meta name="theme-color" content="#000000" />
    <style>
      body {
        background-color: black;
        color: white;
        overflow: hidden;
        position: fixed;
        width: 100dvw;
        height: 100dvh;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: none;
      }
      #splash-screen {
        position: fixed;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        font-size: 68px;
        box-sizing: border-box;
        background-color: black;
        width: 100dvw;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="splash-screen">🦕</div>
    </div>
    <script type="module" src="./src/frontend.tsx"></script>
  </body>
</html>
