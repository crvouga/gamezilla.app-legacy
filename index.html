<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <title>gamezilla.app</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="gamezilla.app is a multiplayer gaming app. Play games online with your friends. There is no need for any downloads. Just play. Play games like Flow, Chess, Battleship, and more."
    />
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="./mask-icon.png" color="#000000" />
    <meta name="theme-color" content="#000000" />
    <style>
      @import 'tailwindcss';
      @layer base {
        *,
        ::after,
        ::before,
        ::backdrop,
        ::file-selector-button {
          border-color: var(--color-neutral-600, currentColor);
        }
      }
      * {
        touch-action: manipulation;
      }
    </style>
  </head>

  <body class="bg-black">
    <div id="root">
      <div class="fixed inset-0 grid place-items-center text-7xl">🦕</div>

    <script type="module" src="./src/frontend.tsx"></script>
