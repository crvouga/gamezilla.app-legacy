<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />

    <title>gamezilla.app</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta
      name="description"
      content="gamezilla.app is a multiplayer gaming app. Play games online with your friends." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/mask-icon.png" color="#000000" />
    <meta name="theme-color" content="#000000" />

    <style>
      html {
        background-color: #000 !important;
      }

      @media (max-width: 360px) {
        html {
          font-size: 75%;
        }
      }

      body {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        /*  */
        height: 100vh;
        max-height: 850px;
        width: 100vw;
        max-width: 448px;
        /*  */
        display: flex;
        align-items: center;
        justify-content: center;
        /*  */
        color: white;
        box-sizing: border-box;
        border-color: rgb(64 64 64);
        border-style: solid;
        border-width: 1px;
        border-radius: 0.25rem;
      }

      #logo {
        font-size: 6rem;
        user-select: none;
        pointer-events: none;
        touch-action: none;
      }
    </style>
  </head>

  <body>
    <div id="logo">🦕</div>

    <script type="module" src="./gamezilla/gamezilla.client.tsx"></script>
  </body>
</html>
