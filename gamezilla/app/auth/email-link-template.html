<!--
    Supabase message variables

    {{ .ConfirmationURL }} : URL to confirm the message
 -->

<div
  style="
    text-align: center;
    color: white;
    background-color: #000;
    padding: 2em;
    font-weight: bolder;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  ">
  <h1 style="font-size: 2rem; color: white">
    This is your
    <span style="font-family: inherit; font-weight: inherit; color: #2196f3"
      >Gamezilla</span
    >
    login email.
  </h1>

  <p>
    <a href="{{ .ConfirmationURL }}">
      <button
        style="
          font-weight: bolder;
          padding: 1em 1.75em;
          font-size: 1.25em;
          background-color: #2196f3;
          color: white;
          border: none;
          border-radius: 0.5em;
          cursor: pointer;
        ">
        LOGIN
      </button>
    </a>
  </p>
</div>
