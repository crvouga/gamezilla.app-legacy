version: '3.1'

services:
  postgres:
    container_name: gamezilla-app-postgres
    image: postgres:16.1
    restart: always
    environment:
      POSTGRES_USER: gamezilla-app
      POSTGRES_PASSWORD: gamezilla-app
      POSTGRES_DB: gamezilla-app
    ports:
      - '5433:5432'
    volumes:
      - gamezilla-app-postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /var/lib/postgresql/data
      - /tmp
    command:
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical

  electric:
    container_name: gamezilla-app-electric
    image: electricsql/electric
    restart: always
    environment:
      DATABASE_URL: postgresql://gamezilla-app:gamezilla-app@localhost:5433/gamezilla-app?sslmode=disable
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  redis:
    container_name: gamezilla-app-redis
    image: redis:6.2.6
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - gamezilla-app-redis-data:/data

volumes:
  gamezilla-app-postgres-data:
  gamezilla-app-redis-data:
