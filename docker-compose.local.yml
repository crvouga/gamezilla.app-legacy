version: "3.1"

services:
  postgres:
    container_name: gamezilla-app-postgres
    image: postgres:16.1
    restart: always
    environment:
      POSTGRES_USER: gamezilla-app
      POSTGRES_PASSWORD: gamezilla-app
      POSTGRES_DB: gamezilla-app
    ports:
      - "5433:5432"
    volumes:
      - gamezilla-app-postgres-data:/var/lib/postgresql/data

  redis:
    container_name: gamezilla-app-redis
    image: redis:6.2.6
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - gamezilla-app-redis-data:/data

volumes:
  gamezilla-app-postgres-data:
  gamezilla-app-redis-data:
