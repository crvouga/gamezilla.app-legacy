# Basic NATS server configuration

# Client port
port: 4222

# HTTP monitoring port
http_port: 8888

# Logging
debug: false
trace: false

# Maximum payload size
max_payload: 1048576 # 1MB

# Maximum number of connections
max_connections: 65536

# Cluster configuration for Fly.io
cluster {
  name: "gamezilla-app-nats"
  port: 6222
  
  routes = [
    "nats-route://gamezilla-app-nats-1.internal:6222"
    "nats-route://gamezilla-app-nats-2.internal:6222"
    "nats-route://gamezilla-app-nats-3.internal:6222"
  ]

  # Cluster connection timeouts
  connect_retries: 30
  authorization {
    user: $NATS_CLUSTER_USER
    password: $NATS_CLUSTER_PASSWORD
  }
}

# Server identification
server_name: $FLY_ALLOC_ID
host: $FLY_PRIVATE_IP
port: 4222

# Jetstream
jetstream {
  store_dir: "/data"
  max_mem: 1G
  max_file: 10G
}

# Security
authorization {
  token: $NATS_AUTH_TOKEN
}
