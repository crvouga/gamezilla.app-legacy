# NATS Server Configuration for Gamezilla App Super Cluster

# Server identity and clustering
server_name: "gamezilla-nats-1"

# Port configurations
port: 4222
monitor_port: 8222

# HTTP monitoring
http_port: 8222

# Logging (stateless - no persistent log file)
logtime: true
debug: false
trace: false

# JetStream disabled for stateless operation
# jetstream {
#   store_dir: "/data/jetstream"
#   max_memory_store: 1GB
#   max_file_store: 10GB
# }

# Clustering configuration for super cluster
cluster {
  name: "gamezilla-cluster"
  port: 6222
  
  # Routes for other nodes in the cluster
  # Add routes for other NATS instances when scaling
  routes = []
}

# Gateway configuration for super cluster
gateway {
  name: "gamezilla-gateway"
  port: 7777
  
  # Gateway connections
  # Add gateways for other clusters when needed
  gateways = []
}

# Security
authorization {
  users = [
    {
      user: "gamezilla_user"
      password: "$2a$11$changeme"  # Change this to a secure password
      permissions: {
        publish: ">"
        subscribe: ">"
      }
    }
  ]
}

# Connection limits
max_connections: 1000
max_payload: 1MB
max_pending: 100MB

# Ping interval and max pings
ping_interval: "2m"
ping_max: 2

# Write deadline
write_deadline: "10s"

# TLS configuration (uncomment when ready for TLS)
# tls {
#   cert_file: "/etc/ssl/certs/nats-server.crt"
#   key_file: "/etc/ssl/private/nats-server.key"
# }

# Health check endpoint configured above
