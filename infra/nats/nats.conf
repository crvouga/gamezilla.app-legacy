# NATS Server Configuration for Railway
server_name: "gamezilla-nats"

# Client port
port: 4222

# Monitoring port
monitor_port: 8222
http_port: 8222

# WebSocket support
websocket {
  port: 9222
  no_tls: true
  same_origin: false
  allowed_origins: ["*"]
}

# Logging
logtime: true
debug: false
trace: false

# Authorization (only enabled if NATS_USER and NATS_PASSWORD are set)
# To enable authentication, set NATS_USER and NATS_PASSWORD environment variables
# If not set, the server will run without authentication (development only)

# Connection limits
max_connections: 1000
max_payload: 1MB
max_pending: 100MB

# Keepalive settings
ping_interval: "2m"
ping_max: 2

# Write deadline
write_deadline: "10s"








