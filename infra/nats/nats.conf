server_name: "gamezilla-nats-1"

port: 4222
monitor_port: 8222

http_port: 8222

logtime: true
debug: false
trace: false

authorization {
  users = [
    {
      user: "${NATS_USER}"
      password: "${NATS_PASSWORD}"
      permissions: {
        publish: ">"
        subscribe: ">"
      }
    }
  ]
}


max_connections: 1000
max_payload: 1MB
max_pending: 100MB


ping_interval: "2m"
ping_max: 2


write_deadline: "10s"








