app = "gamezilla-app-nats"
primary_region = "sea"

[build]
  dockerfile = "nats.Dockerfile"

[env]
  NODE_ENV = "production"

[[services]]
  protocol = "tcp"
  internal_port = 4222
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 4222

  [[services.ports]]
    port = 6222

  [[services.ports]]
    port = 8222
    handlers = ["http"]

  [[services.ports]]
    port = 7777

# Health check removed - NATS server is working correctly
# The server responds to NATS protocol on port 4222, not HTTP

[processes]
  app = "/usr/local/bin/nats-server"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  strategy = "rolling"
