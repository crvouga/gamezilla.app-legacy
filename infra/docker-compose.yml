name: gamezilla_app

services:
  frontend:
    container_name: frontend
    profiles: ['e2e']
    build:
      context: ../
      dockerfile: infra/frontend.Dockerfile
      args:
        NODE_ENV: development
    environment:
      - NODE_ENV=development
    ports:
      - '5173:80'

  backend:
    container_name: backend
    profiles: ['e2e']
    build:
      context: ../
      dockerfile: infra/backend.Dockerfile
      args:
        NODE_ENV: development
    ports:
      - '5002:5002'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - PORT=5002
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  topic:
    profiles: ['e2e']
    container_name: topic
    build:
      context: ../
      dockerfile: infra/topic.Dockerfile
    ports:
      - '8888:8888'

  nats:
    container_name: nats
    build:
      context: ../
      dockerfile: infra/nats.Dockerfile
    ports:
      - '4222:4222'
      - '8888:8888'

  postgres:
    container_name: postgres
    build:
      context: ../
      dockerfile: infra/postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
