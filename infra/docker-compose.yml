name: gamezilla_app

services:
  frontend:
    profiles: ['e2e']
    build:
      context: ../
      dockerfile: infra/frontend.Dockerfile
      args:
        NODE_ENV: development
    environment:
      - TOPIC_URL=ws://topic:5556
    ports:
      - '5173:80'

  backend:
    profiles: ['e2e']
    build:
      context: ../
      dockerfile: infra/backend.Dockerfile
      args:
        NODE_ENV: development
    ports:
      - '5555:5555'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - TOPIC_URL=ws://topic:5556
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  topic:
    profiles: ['e2e']
    build:
      context: ../
      dockerfile: infra/topic.Dockerfile
    ports:
      - '5556:5556'
    environment:
      - NATS_URL=nats://nats:4222

  nats:
    build:
      context: ../
      dockerfile: infra/nats.Dockerfile
    ports:
      - '4222:4222'

  postgres:
    build:
      context: ../
      dockerfile: infra/postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
