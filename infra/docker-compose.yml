name: gamezilla_app

services:
  frontend:
    build:
      context: ../
      dockerfile: infra/frontend.Dockerfile
      args:
        NODE_ENV: development
        BACKEND_URL: http://localhost:5556
        TOPIC_URL: http://localhost:5557
    ports:
      - '5555:80'

  backend:
    build:
      context: ../
      dockerfile: infra/backend.Dockerfile
      args:
        NODE_ENV: development
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - BACKEND_PORT=5556
      - TOPIC_PORT=5557
      - BACKEND_URL=http://localhost:5556
    ports:
      - '5556:5556'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  topic:
    build:
      context: ../
      dockerfile: infra/topic.Dockerfile
    ports:
      - '5557:5557'
    environment:
      - TOPIC_PORT=5557
    depends_on:
      nats:
        condition: service_started

  nats:
    build:
      context: ../
      dockerfile: infra/nats.Dockerfile
    ports:
      - '4222:4222'

  postgres:
    build:
      context: ../
      dockerfile: infra/postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
    ports:
      - '5432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -p 5432']
      interval: 10s
      timeout: 5s
      retries: 5
