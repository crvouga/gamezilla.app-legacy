name: gamezilla_app

services:
  frontend:
    build:
      context: ../
      dockerfile: infra/frontend.Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
        BACKEND_URL: ${BACKEND_URL:?BACKEND_URL is required}
        NATS_URL: ${NATS_URL:?NATS_URL is required}
    ports:
      - '${FRONTEND_PORT:?FRONTEND_PORT is required}:80'
    profiles:
      - e2e
      - all

  backend:
    build:
      context: ../
      dockerfile: infra/backend.Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - NODE_ENV=${NODE_ENV:?NODE_ENV is required}
      - BACKEND_PORT=${BACKEND_PORT:?BACKEND_PORT is required}
      - NATS_URL=${NATS_URL:?NATS_URL is required}
      - BACKEND_URL=${BACKEND_URL:?BACKEND_URL is required}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${BACKEND_PORT:?BACKEND_PORT is required}:${BACKEND_PORT:?BACKEND_PORT is required}'
    profiles:
      - e2e
      - all
  topic:
    build:
      context: ../
      dockerfile: infra/topic.Dockerfile
    depends_on:
      nats:
        condition: service_started
    environment:
      - NODE_ENV=${NODE_ENV:?NODE_ENV is required}
      - TOPIC_PORT=${TOPIC_PORT:?TOPIC_PORT is required}
      - NATS_PORT=${NATS_PORT:?NATS_PORT is required}
      - NATS_URL=${NATS_URL:?NATS_URL is required}
    ports:
      - '${TOPIC_PORT:?TOPIC_PORT is required}:${TOPIC_PORT:?TOPIC_PORT is required}'
    profiles:
      - e2e
      - all

  nats:
    build:
      context: ../
      dockerfile: infra/nats/nats.Dockerfile
    ports:
      - '${NATS_PORT:?NATS_PORT is required}:${NATS_PORT:?NATS_PORT is required}'
    profiles:
      - e2e
      - int
      - local
      - all
  postgres:
    build:
      context: ../
      dockerfile: infra/postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PORT: 5432
    ports:
      - '${POSTGRES_PORT:?POSTGRES_PORT is required}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -p 5432']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - e2e
      - int
      - local
      - all

volumes:
  postgres_data:
