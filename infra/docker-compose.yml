name: gamezilla_app

services:
  app-frontend:
    build:
      context: ../
      dockerfile: infra/frontend/frontend.Dockerfile
      args:
        NODE_ENV: development
    ports:
      - "5173:80"
    profiles:
      - e2e
      - all

  app-backend:
    build:
      context: ../
      dockerfile: infra/backend/backend.Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5002:5002"
    profiles:
      - e2e
      - all

  svc-nats:
    build:
      context: ../
      dockerfile: infra/nats/nats.Dockerfile
    environment:
      - NATS_USER=nats
      - NATS_PASS=nats
    ports:
      - "4222:4222"
      - "8080:8080"
      - "9222:9222"
    profiles:
      - e2e
      - int
      - local
      - all

  svc-postgres:
    build:
      context: ../
      dockerfile: infra/postgres/postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - e2e
      - int
      - local
      - all

volumes:
  postgres_data:
