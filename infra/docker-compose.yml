name: gamezilla_app

services:
  frontend-web:
    build:
      context: ../
      dockerfile: infra/frontend-web/frontend-web.Dockerfile
      args:
        NODE_ENV: development
    ports:
      - '5173:80'
    profiles:
      - e2e
      - all

  backend-rpc:
    build:
      context: ../
      dockerfile: infra/backend-rpc/backend-rpc.Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - NODE_ENV=development
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '5002:5002'
    profiles:
      - e2e
      - all

  backend-topic:
    build:
      context: ../
      dockerfile: infra/backend-topic/backend-topic.Dockerfile
    environment:
      - NODE_ENV=development
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '5003:5003'
    profiles:
      - e2e
      - all

  backend-worker:
    build:
      context: ../
      dockerfile: infra/backend-worker/backend-worker.Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - NODE_ENV=development
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '5004:5004'
    profiles:
      - e2e
      - all

  postgres:
    build:
      context: ../
      dockerfile: infra/postgres/postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -p 5432']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - e2e
      - int
      - local
      - all

volumes:
  postgres_data:
