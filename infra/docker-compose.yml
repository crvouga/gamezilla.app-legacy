name: gamezilla_app

services:
  frontend:
    profiles: ['e2e', 'ci']
    build:
      context: ../
      dockerfile: infra/frontend.Dockerfile
      args:
        NODE_ENV: development
    environment:
      - TOPIC_URL=ws://topic:5556
    ports:
      - '5173:80'

  backend:
    profiles: ['e2e', 'ci']
    build:
      context: ../
      dockerfile: infra/backend.Dockerfile
      args:
        NODE_ENV: development
    ports:
      - '5555:5555'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - TOPIC_URL=ws://topic:5556
      - BACKEND_PORT=5555
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://backend:5555/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  topic:
    profiles: ['e2e', 'ci']
    build:
      context: ../
      dockerfile: infra/topic.Dockerfile
    ports:
      - '5556:5556'
    environment:
      - NATS_URL=nats://nats:4222
      - TOPIC_PORT=5556
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://topic:5556/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    build:
      context: ../
      dockerfile: infra/nats.Dockerfile
    ports:
      - '4222:4222'

  postgres:
    build:
      context: ../
      dockerfile: infra/postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  ci-postgres-migration:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
    command: pnpm db:up
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  ci-unit-tests:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
    command: pnpm unit

  ci-e2e-tests:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
    command: pnpm e2e
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      topic:
        condition: service_healthy

  ci-integration-tests:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
    command: pnpm int
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      ci-postgres-migration:
        condition: service_completed_successfully

  ci-circular-dependencies:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
    command: pnpm cir-deps

  ci-types:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
    command: tsc --noEmit

  ci:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
    depends_on:
      ci-unit-tests:
        condition: service_completed_successfully
      ci-e2e-tests:
        condition: service_completed_successfully
      ci-integration-tests:
        condition: service_completed_successfully
      ci-circular-dependencies:
        condition: service_completed_successfully
      ci-types:
        condition: service_completed_successfully

volumes:
  postgres_data:
