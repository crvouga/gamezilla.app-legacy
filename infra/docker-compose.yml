name: gamezilla_app

services:
  frontend:
    profiles: ['e2e']
    build:
      context: ../
      dockerfile: infra/frontend.Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
        BACKEND_URL: ${BACKEND_URL:?BACKEND_URL is required}
        TOPIC_URL: ${TOPIC_URL:?TOPIC_URL is required}
    ports:
      - '${FRONTEND_PORT:?FRONTEND_PORT is required}:80'

  backend:
    profiles: ['e2e']
    build:
      context: ../
      dockerfile: infra/backend.Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
    ports:
      - '${BACKEND_PORT:?BACKEND_PORT is required}:${BACKEND_PORT:?BACKEND_PORT is required}'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:${POSTGRES_PORT:?POSTGRES_PORT is required}/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      - TOPIC_URL=ws://localhost:${TOPIC_PORT:?TOPIC_PORT is required}
      - BACKEND_PORT=${BACKEND_PORT:?BACKEND_PORT is required}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  topic:
    profiles: ['e2e']
    build:
      context: ../
      dockerfile: infra/topic.Dockerfile
    ports:
      - '${TOPIC_PORT:?TOPIC_PORT is required}:${TOPIC_PORT:?TOPIC_PORT is required}'
    environment:
      - NATS_URL=nats://nats:${NATS_PORT:?NATS_PORT is required}
      - TOPIC_PORT=${TOPIC_PORT:?TOPIC_PORT is required}
    depends_on:
      nats:
        condition: service_started

  nats:
    build:
      context: ../
      dockerfile: infra/nats.Dockerfile
    ports:
      - '${NATS_PORT:?NATS_PORT is required}:${NATS_PORT:?NATS_PORT is required}'

  postgres:
    build:
      context: ../
      dockerfile: infra/postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
    ports:
      - '${POSTGRES_PORT:?POSTGRES_PORT is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -p ${POSTGRES_PORT:?POSTGRES_PORT is required}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
