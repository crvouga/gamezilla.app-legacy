name: gamezilla_app

services:
  ci:
    profiles: ['ci']
    image: gamezilla-app-ci
    command: echo "All good to deploy"
    platform: ${DOCKER_PLATFORM}
    depends_on:
      ci-unit-tests:
        condition: service_completed_successfully
      ci-e2e-tests:
        condition: service_completed_successfully
      ci-int-tests:
        condition: service_completed_successfully
      ci-cir-deps:
        condition: service_completed_successfully
      ci-type-check:
        condition: service_completed_successfully

  frontend:
    profiles: ['e2e', 'ci']
    build:
      context: ../
      dockerfile: infra/frontend.Dockerfile
      args:
        NODE_ENV: development
        BACKEND_URL: http://backend:5555
        TOPIC_URL: http://topic:5556
    ports:
      - '80:80'
    platform: ${DOCKER_PLATFORM}

  backend:
    profiles: ['e2e', 'ci']
    build:
      context: ../
      dockerfile: infra/backend.Dockerfile
      args:
        NODE_ENV: development
    ports:
      - '5555:5555'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - TOPIC_URL=ws://topic:5556
      - BACKEND_PORT=5555
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      ci-postgres-migration:
        condition: service_completed_successfully
    platform: ${DOCKER_PLATFORM}

  topic:
    profiles: ['e2e', 'ci']
    build:
      context: ../
      dockerfile: infra/topic.Dockerfile
    ports:
      - '5556:5556'
    environment:
      - NATS_URL=nats://nats:4222
      - TOPIC_PORT=5556
    depends_on:
      nats:
        condition: service_started
    platform: ${DOCKER_PLATFORM}

  nats:
    build:
      context: ../
      dockerfile: infra/nats.Dockerfile
    ports:
      - '4222:4222'
    platform: ${DOCKER_PLATFORM}

  postgres:
    build:
      context: ../
      dockerfile: infra/postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    platform: ${DOCKER_PLATFORM}

  ci-postgres-migration:
    profiles: ['ci']
    image: gamezilla-app-ci
    command: pnpm db:up
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    platform: ${DOCKER_PLATFORM}

  ci-unit-tests:
    profiles: ['ci']
    image: gamezilla-app-ci
    command: pnpm unit
    environment:
      - BACKEND_URL=http://backend:5555
      - TOPIC_URL=http://topic:5556
    platform: ${DOCKER_PLATFORM}

  ci-e2e-tests:
    profiles: ['ci']
    image: gamezilla-app-ci
    environment:
      - PLAYWRIGHT_BASE_URL=http://localhost:80
    command: pnpm e2e
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      topic:
        condition: service_started
    platform: ${DOCKER_PLATFORM}

  ci-int-tests:
    profiles: ['ci']
    image: gamezilla-app-ci
    command: pnpm int
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      ci-postgres-migration:
        condition: service_completed_successfully
    platform: ${DOCKER_PLATFORM}

  ci-cir-deps:
    profiles: ['ci']
    image: gamezilla-app-ci
    command: pnpm cir-deps
    platform: ${DOCKER_PLATFORM}

  ci-type-check:
    profiles: ['ci']
    image: gamezilla-app-ci
    command: pnpm exec tsc --noEmit
    platform: ${DOCKER_PLATFORM}
