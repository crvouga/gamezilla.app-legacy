name: gamezilla_app

services:
  frontend:
    profiles: ['e2e', 'ci']
    build:
      context: ../
      dockerfile: infra/frontend.Dockerfile
      args:
        NODE_ENV: development
      no_cache: true
    environment:
      - TOPIC_URL=ws://topic:5556
    ports:
      - '5173:80'
  backend:
    profiles: ['e2e', 'ci']
    build:
      context: ../
      dockerfile: infra/backend.Dockerfile
      args:
        NODE_ENV: development
      no_cache: true
    ports:
      - '5555:5555'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - TOPIC_URL=ws://topic:5556
      - BACKEND_PORT=5555
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      ci-postgres-migration:
        condition: service_completed_successfully

  topic:
    profiles: ['e2e', 'ci']
    build:
      context: ../
      dockerfile: infra/topic.Dockerfile
      no_cache: true
    ports:
      - '5556:5556'
    environment:
      - NATS_URL=nats://nats:4222
      - TOPIC_PORT=5556
    depends_on:
      nats:
        condition: service_started

  nats:
    build:
      context: ../
      dockerfile: infra/nats.Dockerfile
    ports:
      - '4222:4222'

  postgres:
    build:
      context: ../
      dockerfile: infra/postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  ci-postgres-migration:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
      no_cache: true
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date +%s)}
    command: pnpm db:up
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  ci-unit-tests:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
      no_cache: true
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date +%s)}
    command: pnpm unit

  ci-e2e-tests:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
      no_cache: true
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date +%s)}
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      topic:
        condition: service_started

  ci-int-tests:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
      no_cache: true
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date +%s)}
    command: pnpm int
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      ci-postgres-migration:
        condition: service_completed_successfully

  ci-cir-deps:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
      no_cache: true
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date +%s)}
    command: pnpm cir-deps

  ci-type-check:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
      no_cache: true
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date +%s)}
    command: pnpm exec tsc --noEmit

  ci:
    profiles: ['ci']
    build:
      context: ../
      dockerfile: infra/ci.Dockerfile
      no_cache: true
    depends_on:
      ci-unit-tests:
        condition: service_completed_successfully
      ci-e2e-tests:
        condition: service_completed_successfully
      ci-int-tests:
        condition: service_completed_successfully
      ci-cir-deps:
        condition: service_completed_successfully
      ci-type-check:
        condition: service_completed_successfully

volumes:
  postgres_data:
