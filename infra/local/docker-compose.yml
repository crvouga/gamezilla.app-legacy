version: '3.1'

name: gamezilla-app

services:
  frontend:
    container_name: frontend
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - type: bind
        source: ${PWD}
        target: /app
    command: >
      sh -c "
        ls -la /app &&
        echo 'Contents of /app:' &&
        bun install && 
        bun frontend"
    ports:
      - '5173:5173'
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
      VITE_POWERSYNC_URL: ${VITE_POWERSYNC_URL}
    depends_on:
      backend:
        condition: service_started
      powersync:
        condition: service_started
      electric:
        condition: service_started

  backend:
    container_name: backend
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - type: bind
        source: ${PWD}
        target: /app
    command: >
      sh -c "
        ls -la /app &&
        echo 'Contents of /app:' &&
        bun install && 
        bun backend"
    ports:
      - '${PORT}:${PORT}'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: ${PORT}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: gamezilla_app
      POSTGRES_PASSWORD: gamezilla_app
      POSTGRES_DB: gamezilla_app
    ports:
      - '5432:5432'
    volumes:
      - gamezilla-app-postgres-data:/var/lib/postgresql/data
    command: >
      sh -c "docker-entrypoint.sh postgres -c listen_addresses='*' -c port=5432 -c ssl=off -c wal_level=logical &
      until pg_isready -U gamezilla_app; do sleep 1; done;
      psql -U gamezilla_app -d gamezilla_app -c \"CREATE PUBLICATION powersync FOR ALL TABLES;\";
      wait"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamezilla_app']
      interval: 1s
      timeout: 0s
      retries: 10

  powersync:
    container_name: powersync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      powersync-storage-postgres:
        condition: service_healthy
    image: journeyapps/powersync-service:latest
    command: ['start', '-r', 'unified']
    volumes:
      - ../../src/powersync:/powersync
    environment:
      POWERSYNC_CONFIG_PATH: /powersync/config.yaml
      PS_POSTGRES_STORAGE_DATABASE_URL: ${PS_POSTGRES_STORAGE_DATABASE_URL}
      PS_POSTGRES_REPLICATION_DATABASE_URL: ${PS_POSTGRES_REPLICATION_DATABASE_URL}
      PS_JWKS_URI: ${PS_JWKS_URI}
    ports:
      - 8080:8080

  powersync-storage-postgres:
    container_name: powersync-storage-postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: powersync_storage
      POSTGRES_PASSWORD: powersync_storage
      POSTGRES_DB: powersync_storage
    ports:
      - '5433:5433'
    volumes:
      - gamezilla-app-powersync-storage-postgres-data:/var/lib/postgresql/data
    # command: ['-c', 'listen_addresses=*', '-c', 'port=5432', '-c', 'ssl=off', '-c', 'wal_level=logical']
    command: >
      sh -c "docker-entrypoint.sh postgres -c listen_addresses='*' -c port=5432 -c ssl=off -c wal_level=logical &
      until pg_isready -U powersync_storage; do sleep 1; done;
      psql -U powersync_storage -d powersync_storage -c \"CREATE USER powersync_storage_user WITH PASSWORD 'powersync_storage_user';\";
      psql -U powersync_storage -d powersync_storage -c \"GRANT CREATE ON DATABASE postgres TO powersync_storage_user;\";
      wait"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U powersync_storage']
      interval: 1s
      timeout: 0s
      retries: 10

  electric:
    container_name: electric
    image: electricsql/electric
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  redis:
    container_name: redis
    image: redis:6.2.6
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 0s
      retries: 10

volumes:
  gamezilla-app-postgres-data:
  gamezilla-app-powersync-storage-postgres-data:
