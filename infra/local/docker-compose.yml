version: '3.1'

name: gamezilla-app

services:
  postgres:
    container_name: gamezilla-app-postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: gamezilla_app
      POSTGRES_PASSWORD: gamezilla_app
      POSTGRES_DB: gamezilla_app
    ports:
      - '5432:5432'
    volumes:
      - gamezilla-app-postgres-data:/var/lib/postgresql/data
    command: ['-c', 'listen_addresses=*', '-c', 'port=5432', '-c', 'ssl=off', '-c', 'wal_level=logical']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamezilla_app']
      interval: 10s
      timeout: 5s
      retries: 5

  powersync:
    container_name: gamezilla-app-powersync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    image: journeyapps/powersync-service:latest
    command: ['start', '-r', 'unified']
    volumes:
      - ../../src/powersync:/powersync
    environment:
      POWERSYNC_CONFIG_PATH: /powersync/config.yaml
      PS_POSTGRES_STORAGE_DATABASE_URL: postgresql://powersync_storage:powersync_storage@postgres:5432/powersync_storage
      PS_POSTGRES_REPLICATION_DATABASE_URL: postgresql://gamezilla_app:gamezilla_app@postgres:5432/gamezilla_app
      PS_JWKS_URI: http://host.docker.internal:5002/powersync/jwks
    ports:
      - 8080:8080

  electric:
    container_name: gamezilla-app-electric
    image: electricsql/electric
    restart: always
    environment:
      DATABASE_URL: postgresql://gamezilla_app:gamezilla_app@postgres:5432/gamezilla_app
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  redis:
    container_name: gamezilla-app-redis
    image: redis:6.2.6
    restart: always
    ports:
      - '6379:6379'

volumes:
  gamezilla-app-postgres-data:
