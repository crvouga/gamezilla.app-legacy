version: '3.1'

services:
  postgres:
    container_name: gamezilla-app-postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: gamezilla-app
      POSTGRES_PASSWORD: gamezilla-app
      POSTGRES_DB: gamezilla-app
    ports:
      - '5433:5432'
    volumes:
      - gamezilla-app-postgres-data:/var/lib/postgresql/data
    command: ['-c', 'listen_addresses=*', '-c', 'port=5432', '-c', 'ssl=off', '-c', 'wal_level=logical']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamezilla-app']
      interval: 10s
      timeout: 5s
      retries: 5

  powersync:
    container_name: gamezilla-app-powersync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    image: journeyapps/powersync-service:latest
    command: ['start', '-r', 'unified']
    volumes:
      - ../../powersync:/powersync
    environment:
      POWERSYNC_CONFIG_PATH: /powersync/config.yaml
    ports:
      - 8080:8080

  electric:
    container_name: gamezilla-app-electric
    image: electricsql/electric
    restart: always
    environment:
      DATABASE_URL: postgresql://gamezilla-app:gamezilla-app@postgres:5432/gamezilla-app?sslmode=disable
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  redis:
    container_name: gamezilla-app-redis
    image: redis:6.2.6
    restart: always
    ports:
      - '6379:6379'

volumes:
  gamezilla-app-postgres-data:
