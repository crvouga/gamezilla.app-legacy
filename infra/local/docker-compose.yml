name: gamezilla_app

services:
  frontend:
    container_name: frontend
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - type: bind
        source: ${PWD}
        target: /app
    command: >
      sh -c "bun install && bun frontend"
    ports:
      - '5173:5173'
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
      VITE_POWERSYNC_URL: ${VITE_POWERSYNC_URL}
    depends_on:
      backend:
        condition: service_started
      powersync:
        condition: service_started
      electric:
        condition: service_started

  backend:
    container_name: backend
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - type: bind
        source: ${PWD}
        target: /app
    command: >
      sh -c "bun install && bun backend:build && bun backend"
    ports:
      - '${PORT}:${PORT}'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: ${PORT}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      sh -c "docker-entrypoint.sh postgres -c listen_addresses='*' -c port=5432 -c ssl=off -c wal_level=logical &
      until pg_isready -U postgres; do sleep 1; done;
      psql -U postgres -d postgres -c \"CREATE PUBLICATION powersync FOR ALL TABLES;\";
      wait"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  powersync:
    container_name: powersync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      powersync_storage_postgres:
        condition: service_healthy
    image: journeyapps/powersync-service:latest
    command: ['start', '-r', 'unified']
    volumes:
      - ../../src/service-powersync:/powersync
    environment:
      POWERSYNC_CONFIG_PATH: /powersync/config.yaml
      PS_POSTGRES_STORAGE_DATABASE_URL: ${PS_POSTGRES_STORAGE_DATABASE_URL}
      PS_POSTGRES_REPLICATION_DATABASE_URL: ${PS_POSTGRES_REPLICATION_DATABASE_URL}
      PS_JWKS_URI: ${PS_JWKS_URI}
    ports:
      - 8080:8080

  powersync_storage_postgres:
    container_name: powersync_storage_postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: powersync_storage_postgres
      POSTGRES_PASSWORD: powersync_storage_postgres
      POSTGRES_DB: powersync_storage_postgres
    ports:
      - '5433:5433'
    volumes:
      - powersync_storage_postgres_data:/var/lib/postgresql/data
    command: >
      sh -c "docker-entrypoint.sh postgres -c listen_addresses='*' -c port=5432 -c ssl=off -c wal_level=logical &
      until pg_isready -U powersync_storage_postgres; do sleep 1; done;
      wait"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U powersync_storage_postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  electric:
    container_name: electric
    image: electricsql/electric
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  redis:
    container_name: redis
    image: redis:6.2.6
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  powersync_storage_postgres_data:
  redis_data:
