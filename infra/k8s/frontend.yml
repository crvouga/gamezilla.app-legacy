apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gamezilla-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: your-registry/gamezilla-app-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '300m'
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: gamezilla-app
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
