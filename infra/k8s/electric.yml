apiVersion: apps/v1
kind: Deployment
metadata:
  name: electric
  namespace: gamezilla-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: electric
  template:
    metadata:
      labels:
        app: electric
    spec:
      containers:
        - name: electric
          image: your-registry/gamezilla-app-electric:latest
          ports:
            - containerPort: 5133
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '500m'
---
apiVersion: v1
kind: Service
metadata:
  name: electric-service
  namespace: gamezilla-app
spec:
  selector:
    app: electric
  ports:
    - port: 80
      targetPort: 5133
  type: ClusterIP
