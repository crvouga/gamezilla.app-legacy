apiVersion: apps/v1
kind: Deployment
metadata:
  name: powersync
  namespace: gamezilla.app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: powersync
  template:
    metadata:
      labels:
        app: powersync
    spec:
      containers:
        - name: powersync
          image: journeyapps/powersync-service:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config-volume
              mountPath: /powersync
          env:
            - name: POWERSYNC_CONFIG_PATH
              value: '/powersync/config.yaml'
            - name: PS_POSTGRES_STORAGE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: powersync-secrets
                  key: storage-db-url
            - name: PS_POSTGRES_REPLICATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: powersync-secrets
                  key: replication-db-url
            - name: PS_JWKS_URI
              valueFrom:
                secretKeyRef:
                  name: powersync-secrets
                  key: jwks-uri
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '500m'
      volumes:
        - name: config-volume
          configMap:
            name: powersync-config
---
apiVersion: v1
kind: Service
metadata:
  name: powersync-service
  namespace: gamezilla.app
spec:
  selector:
    app: powersync
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
