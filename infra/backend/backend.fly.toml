

app = "gamezilla-app-backend"
primary_region = "sea" 

[build]
  dockerfile = "backend.Dockerfile"
  build_args = { NODE_ENV = "production", BACKEND_PORT = "5002" }

[env]
  NODE_ENV = "production"
  BACKEND_PORT = "5002"

[[services]]
  protocol = "tcp"
  internal_port = 5002
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]


  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "1s"
    method = "get"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

    [services.http_checks.headers]
      Content-Type = "application/json"

[processes]
  app = "pnpm exec tsx src/backend.ts"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[deploy]
  strategy = "rolling"