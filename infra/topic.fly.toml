# Fly.io configuration for Gamezilla Topic Service
# Single region WebSocket server

app = "gamezilla-app"
primary_region = "lax"  # Los Angeles, US West

[build]
  dockerfile = "topic.Dockerfile"
  build_args = { NODE_ENV = "production", TOPIC_PORT = "8080" }

[env]
  NODE_ENV = "production"
  TOPIC_PORT = "8080"

# HTTP service configuration
[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Health checks
  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "1s"
    method = "get"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

    [services.http_checks.headers]
      Content-Type = "application/json"

# Process configuration
[processes]
  app = "pnpm exec tsx src/topic.ts"

# VM configuration
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
