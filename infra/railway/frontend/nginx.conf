server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml audio/wav audio/mpeg;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    # Serve pre-compressed files if available
    gzip_static on;

    location / {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;

    # Handle caching for static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wav|mp3)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";

        # Add Brotli compression for supported browsers
        brotli on;
        brotli_static on;
        brotli_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml audio/wav audio/mpeg;
        brotli_comp_level 5;
    }
}
