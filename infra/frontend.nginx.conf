events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Aggressive gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types 
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/wasm
        application/font-woff
        application/font-woff2;
    gzip_min_length 1000;
    gzip_comp_level 9;

    # Optimize sendfile
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Aggressive server-side cache settings
    open_file_cache max=10000 inactive=10m;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # Aggressive client caching settings
    expires $expires;
    map $sent_http_content_type $expires {
        default                    1y;
        text/html                  epoch;
        text/css                   1y;
        application/javascript     1y;
        application/json           1h;
        ~image/                    1y;
        ~font/                     1y;
        ~audio/                    1y;
        ~video/                    1y;
        application/pdf            1M;
        application/wasm           1y;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # API routes - no caching
        location ~ ^/(api|auth|health)/ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri $uri/ =404;
        }

        # Handle SPA routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
            expires $expires;
            add_header Cache-Control "public, no-transform";
            # Add aggressive caching headers for non-HTML
            add_header X-Cache-Status "HIT" always;
        }

        # Aggressive caching for static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif|mp3|mp4|m4a|wav|ogg|webm|pdf|wasm|gz|br)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
            add_header Pragma "public";
            add_header Vary "Accept-Encoding";
            access_log off;
            
            # Enable pre-compressed files (if available)
            gzip_static on;
        }

        # Enable ETags for better cache validation
        etag on;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}