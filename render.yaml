# Exported from Render on 2024-12-31T00:24:51Z
databases:
  - name: postgres
    databaseName: gamezillaapp
    user: gamezillaapp
    plan: basic-256mb
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    postgresMajorVersion: '16'
    diskSizeGB: 15
services:
  - type: web
    name: client
    runtime: static
    repo: https://github.com/crvouga/gamezilla.app
    buildCommand: bun client:build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /<*>
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        sync: true
      - key: VITE_VDOM_IMPL
        sync: true
        value: 'inferno'
  - type: web
    name: server
    runtime: node
    repo: https://github.com/crvouga/gamezilla.app
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
    region: oregon
    buildCommand: bun server:build
    startCommand: bun server
version: '1'
