name: Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cir-deps:
    name: Circular Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm cir-deps

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run env:ci
      - run: pnpm tc

  unit:
    name: Unit Tests
    needs: [cir-deps, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run env:ci
      - run: pnpm unit

  e2e-fast:
    name: E2E Fast Tests
    needs: [cir-deps, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run env:ci
      - run: pnpm e2e:fast

  integration:
    name: Integration Tests
    needs: [e2e-fast, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run env:ci
      - name: Start Docker daemon
        run: |
          # Start Docker daemon in background if not running
          if ! pgrep dockerd > /dev/null; then
            sudo dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2376 &
            sleep 3
          fi
          # Fix socket permissions
          sudo chmod 666 /var/run/docker.sock
          # Verify Docker is working
          docker version
      - run: pnpm infra:int:up
      - run: sleep 3
      - name: Database Migration
        run: pnpm db:up
      - run: pnpm int

  e2e:
    name: E2E Tests
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run env:ci
      - name: Start Docker daemon
        run: |
          # Start Docker daemon in background if not running
          if ! pgrep dockerd > /dev/null; then
            sudo dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2376 &
            sleep 3
          fi
          # Fix socket permissions
          sudo chmod 666 /var/run/docker.sock
          # Verify Docker is working
          docker version
      - run: pnpm infra:e2e:up
      - run: sleep 3
      - run: pnpm db:up
      - run: pnpm e2e:setup
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run db:up
