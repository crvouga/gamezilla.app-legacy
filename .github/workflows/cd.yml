name: CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -f infra/ci.Dockerfile -t gamezilla-app-ci .

      - name: Run CI
        run: |
          docker compose --profile ci -f ./infra/docker-compose.yml down
          docker compose --profile ci -f ./infra/docker-compose.yml up --build --abort-on-container-exit --exit-code-from ci ci

      - name: Collect CI logs
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose --profile ci -f ./infra/docker-compose.yml logs > ci-logs/docker-compose.txt
          docker cp $(docker ps -aqf name=ci-e2e-tests):/app/test-results ./ci-logs/test-results || true

      - name: Upload CI logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: ci-logs/

  deploy:
    name: Deploy
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
