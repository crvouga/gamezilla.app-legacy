name: CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env file
        run: pnpm run env:ci

      - name: Run type checker
        run: pnpm exec tsc

      - name: Check circular dependencies
        run: pnpm run cir-deps

      - name: Run unit tests
        run: pnpm run unit

      - name: Start infra
        run: pnpm e2e:up

      - name: Wait for infra to be ready
        run: sleep 10

      - name: Run db:up
        run: pnpm run db:up

      - name: Run integration tests
        run: pnpm run int

      - name: Setup e2e
        run: pnpm e2e:ci:setup

      - name: Run e2e tests
        run: pnpm run e2e:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run db:up
