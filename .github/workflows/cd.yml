name: CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runner base image
        run: |
          echo "Building runner base image..."
          docker build --platform linux/amd64 -f infra/runner-base.Dockerfile -t crvouga/runner-base:latest .

      - name: Build runner image
        run: |
          echo "Building runner image..."
          docker build --platform linux/amd64 -f infra/runner.Dockerfile -t runner .

      - name: Build service images
        run: |
          echo "Building service images..."
          docker compose --profile ci -f ./infra/docker-compose.yml build

      - name: Run CI
        run: |
          echo "Cleaning up existing containers..."
          docker compose --profile ci -f ./infra/docker-compose.yml down
          echo "Running CI pipeline..."
          docker compose --profile ci -f ./infra/docker-compose.yml up --abort-on-container-exit --exit-code-from ci ci

      - name: Collect docker compose logs
        if: always()
        run: |
          docker compose --profile ci -f ./infra/docker-compose.yml logs > docker-compose.txt

      - name: Upload docker compose logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-compose.txt
          path: docker-compose.txt

      - name: Copy e2e test results
        if: always()
        run: |
          docker cp $(docker ps -aqf name=ci-e2e-tests):/app/test-results/. ./ || true

      - name: Upload e2e test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    name: Deploy
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
