name: CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CI
        run: |
          docker build -f infra/runner.Dockerfile -t runner .
          docker compose --profile ci -f ./infra/docker-compose.yml down
          docker compose --profile ci -f ./infra/docker-compose.yml up --build --abort-on-container-exit --exit-code-from ci ci

      - name: Collect CI logs
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose --profile ci -f ./infra/docker-compose.yml logs > ci-logs/docker-compose.txt
          docker cp $(docker ps -aqf name=ci-e2e-tests):/app/test-results ./ci-logs/test-results || true

      - name: Upload CI logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: ci-logs/

  cd:
    name: CD
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CD
        run: |
          docker build -f infra/runner.Dockerfile -t runner .
          docker run --rm -e DATABASE_URL=${{ secrets.DATABASE_URL }} runner pnpm db:up
