name: CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runner base image
        run: |
          echo "Building runner base image..."
          docker build --platform linux/amd64 -f infra/runner-base.Dockerfile -t crvouga/runner-base:latest .

      - name: Build runner image
        run: |
          echo "Building runner image..."
          docker build --platform linux/amd64 -f infra/runner.Dockerfile -t runner .

      - name: Run CI
        run: |
          echo "Cleaning up existing containers..."
          docker compose --profile ci -f ./infra/docker-compose.yml down
          echo "Running CI pipeline..."
          docker compose --profile ci -f ./infra/docker-compose.yml up --build --abort-on-container-exit --exit-code-from ci ci

      - name: Collect CI logs
        if: always()
        run: |
          echo "Creating logs directory..."
          mkdir -p ci-logs
          echo "Collecting docker compose logs..."
          docker compose --profile ci -f ./infra/docker-compose.yml logs > ci-logs/docker-compose.txt
          echo "Collecting e2e test results..."
          docker cp $(docker ps -aqf name=ci-e2e-tests):/app/test-results ./ci-logs/test-results || true

      - name: Upload CI logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: ci-logs/

  deploy:
    name: Deploy
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runner base image
        run: |
          echo "Building runner base image..."
          docker build --platform linux/amd64 -f infra/runner-base.Dockerfile -t crvouga/runner-base:latest .

      - name: Build runner image
        run: |
          echo "Building runner image..."
          docker build --platform linux/amd64 -f infra/runner.Dockerfile -t runner .

      - name: Run database migrations
        run: |
          echo "Creating cd-logs directory..."
          mkdir -p cd-logs
          echo "Running database migrations..."
          docker run --platform linux/amd64 --rm runner npx dbmate up --url ${{ secrets.DATABASE_URL }} > cd-logs/migrations.txt 2>&1

      - name: Upload CD logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-logs
          path: cd-logs/
