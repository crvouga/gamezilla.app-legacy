name: CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run CI via Docker Compose
        run: |
          docker compose -f infra/docker-compose.yml --profile ci up --build --abort-on-container-exit --exit-code-from ci || exit_code=$?
          docker compose -f infra/docker-compose.yml logs --no-color > ci_docker_logs.txt
          exit ${exit_code:-0}

      - name: Upload CI logs
        uses: actions/upload-artifact@v4
        with:
          name: ci-docker-logs
          path: ci_docker_logs.txt

  deploy:
    name: Deploy
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
